<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Moon TV</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      /* Nous-inspired palette */
      --bg: #07070d;
      --bg-elevated: #0d0d18;
      --bg-card: #111120;
      --border: #1e1e30;
      --border-bright: #2a2a45;
      --text: #e8e8f0;
      --text-dim: #6a6a85;
      --text-faint: #44445a;
      --accent: #FFD700;           /* Nous gold */
      --accent-dim: #B8860B;       /* dark goldenrod */
      --accent-glow: rgba(255, 215, 0, 0.15);
      --accent-glow-strong: rgba(255, 215, 0, 0.3);
      --cornsilk: #FFF8DC;
      --success: #4dd0e1;          /* cyan accent */
      --danger: #ef5350;
      --gradient-cosmic: radial-gradient(ellipse at top, #1a1a2e 0%, #07070d 60%);
      --gradient-moon: radial-gradient(circle at 35% 35%, #FFF8DC 0%, #FFD700 40%, #B8860B 70%, #654321 100%);
    }

    body {
      background: var(--gradient-cosmic);
      color: var(--text);
      font-family: 'Space Grotesk', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* --- Starfield background --- */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 3s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.8; }
    }

    /* --- Top bar --- */
    .topbar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px);
      background: rgba(7, 7, 13, 0.7);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.5px;
    }
    .moon-orb {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--gradient-moon);
      box-shadow: 0 0 20px var(--accent-glow-strong), inset -4px -4px 8px rgba(0,0,0,0.3);
      animation: moonPulse 4s ease-in-out infinite;
    }
    @keyframes moonPulse {
      0%, 100% { box-shadow: 0 0 20px var(--accent-glow-strong), inset -4px -4px 8px rgba(0,0,0,0.3); }
      50% { box-shadow: 0 0 40px var(--accent-glow-strong), inset -4px -4px 8px rgba(0,0,0,0.3); }
    }
    .logo .name { color: var(--cornsilk); }
    .logo .tv { color: var(--accent-dim); font-weight: 400; }
    .viewers {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
    }
    .live-dot {
      width: 6px;
      height: 6px;
      background: var(--danger);
      border-radius: 50%;
      animation: livePulse 1.5s infinite;
      box-shadow: 0 0 8px var(--danger);
    }
    @keyframes livePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* --- Main layout --- */
    .main {
      position: relative;
      z-index: 5;
      display: grid;
      grid-template-columns: 1fr 380px;
      flex: 1;
      min-height: 0;
    }

    /* --- Player --- */
    .player-area {
      display: flex;
      flex-direction: column;
      padding: 32px;
      gap: 20px;
    }
    .player-wrapper {
      background: #000;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 16/9;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 0 60px rgba(255, 215, 0, 0.05);
    }
    .player-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .player-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      color: var(--text-faint);
    }
    .moon-large {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--gradient-moon);
      box-shadow: 0 0 60px var(--accent-glow-strong), inset -8px -8px 16px rgba(0,0,0,0.3);
      animation: moonFloat 5s ease-in-out infinite;
    }
    @keyframes moonFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    .placeholder-text {
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .now-playing {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .now-playing .np-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-dim);
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
    }
    .now-playing .np-prompt {
      font-size: 14px;
      color: var(--text);
      font-weight: 400;
    }

    /* --- Sidebar --- */
    .sidebar {
      border-left: 1px solid var(--border);
      background: var(--bg-elevated);
      display: flex;
      flex-direction: column;
      padding: 32px 28px;
      gap: 28px;
      overflow-y: auto;
    }
    .sidebar-section h2 {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--accent-dim);
      margin-bottom: 14px;
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar-section h2::before {
      content: '';
      width: 12px;
      height: 1px;
      background: var(--accent-dim);
    }

    /* --- Prompt form --- */
    .prompt-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .prompt-input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      color: var(--text);
      font-size: 14px;
      font-family: 'Space Grotesk', sans-serif;
      resize: none;
      min-height: 80px;
      transition: all 0.25s ease;
      line-height: 1.5;
    }
    .prompt-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .prompt-input::placeholder {
      color: var(--text-faint);
    }
    .submit-btn {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 14px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .submit-btn:hover {
      box-shadow: 0 0 30px var(--accent-glow-strong);
      transform: translateY(-1px);
    }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .price-tag {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
    }
    .price-tag .price {
      color: var(--accent);
      font-weight: 600;
    }
    .price-tag .divider {
      width: 1px;
      height: 10px;
      background: var(--border-bright);
    }

    /* --- Queue items --- */
    .queue-item, .history-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
      font-size: 13px;
      transition: border-color 0.2s;
    }
    .queue-item:hover, .history-item:hover {
      border-color: var(--border-bright);
    }
    .queue-item .prompt, .history-item .prompt {
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .queue-item .meta, .history-item .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-dim);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: 'JetBrains Mono', monospace;
    }
    .status-generating {
      background: rgba(255, 215, 0, 0.1);
      color: var(--accent);
      border: 1px solid rgba(255, 215, 0, 0.2);
    }
    .status-ready {
      background: rgba(77, 208, 225, 0.1);
      color: var(--success);
      border: 1px solid rgba(77, 208, 225, 0.2);
    }
    .status-failed {
      background: rgba(239, 83, 80, 0.1);
      color: var(--danger);
      border: 1px solid rgba(239, 83, 80, 0.2);
    }
    .status-aired {
      background: rgba(106, 106, 133, 0.1);
      color: var(--text-dim);
      border: 1px solid rgba(106, 106, 133, 0.15);
    }
    .generating-dots span {
      animation: genDots 1.4s infinite;
    }
    .generating-dots span:nth-child(2) { animation-delay: 0.2s; }
    .generating-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes genDots {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
    .empty-state {
      color: var(--text-faint);
      font-size: 12px;
      padding: 12px 0;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
    }

    /* --- Toast --- */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg-elevated);
      border: 1px solid var(--border-bright);
      border-radius: 10px;
      padding: 14px 28px;
      font-size: 13px;
      z-index: 1000;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      font-family: 'JetBrains Mono', monospace;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.error { border-color: var(--danger); color: var(--danger); }
    .toast.success { border-color: var(--success); color: var(--success); }

    /* --- Scanline overlay effect --- */
    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 2px,
        rgba(255, 215, 0, 0.01) 3px,
        transparent 4px
      );
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
      .main { grid-template-columns: 1fr; }
      .sidebar { border-left: none; border-top: 1px solid var(--border); }
      .player-area { padding: 16px; }
      .sidebar { padding: 20px; }
    }
  </style>
</head>
<body>
  <!-- Starfield -->
  <div class="stars" id="stars"></div>
  <div class="scanlines"></div>

  <!-- Top bar -->
  <div class="topbar">
    <div class="logo">
      <div class="moon-orb"></div>
      <span><span class="name">FULL MOON</span> <span class="tv">TV</span></span>
    </div>
    <div class="viewers">
      <span class="live-dot"></span>
      <span id="viewer-count">0</span> watching
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Player -->
    <div class="player-area">
      <div class="player-wrapper" id="player">
        <div class="player-placeholder" id="placeholder">
          <div class="moon-large"></div>
          <div class="placeholder-text" id="placeholder-text">Awaiting transmission</div>
        </div>
      </div>
      <div class="now-playing">
        <span class="np-label">Now Playing</span>
        <span class="np-prompt" id="now-playing-prompt">—</span>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-section">
        <h2>Transmit</h2>
        <form class="prompt-form" id="prompt-form">
          <textarea
            class="prompt-input"
            id="prompt-input"
            placeholder="Describe a scene for the next 5-second transmission..."
            maxlength="500"
            rows="3"
          ></textarea>
          <button type="submit" class="submit-btn" id="submit-btn">
            Transmit Prompt
          </button>
          <div class="price-tag">
            <span class="price">$1.00</span>
            <span class="divider"></span>
            <span>per prompt · USDC on Solana</span>
          </div>
        </form>
      </div>

      <div class="sidebar-section">
        <h2>Up Next <span id="queue-count" style="color: var(--text-faint);">0</span></h2>
        <div id="queue-list">
          <div class="empty-state">Queue is empty</div>
        </div>
      </div>

      <div class="sidebar-section">
        <h2>Recently Aired</h2>
        <div id="history-list">
          <div class="empty-state">No transmissions yet</div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // --- Starfield ---
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 80; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      const size = Math.random() * 2 + 0.5;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 3 + 's';
      starsContainer.appendChild(star);
    }

    // --- State ---
    const $ = (s) => document.querySelector(s);
    const state = { nowPlaying: null, upNext: [], recentlyPlayed: [], viewerCount: 0 };

    // --- SSE: live state ---
    const sse = new EventSource('/api/live');
    sse.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data);
        Object.assign(state, data);
        render();
      } catch {}
    };

    // --- Initial state ---
    fetch('/api/state').then(r => r.json()).then(data => {
      Object.assign(state, data);
      render();
    }).catch(() => {
      // Dev mode — no backend, show mock
      state.viewerCount = 1;
      render();
    });

    // --- Submit ---
    $('#prompt-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = $('#prompt-input').value.trim();
      if (!prompt) return;

      const btn = $('#submit-btn');
      btn.disabled = true;
      btn.textContent = 'Transmitting...';

      try {
        const res = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt }),
        });
        const data = await res.json();

        if (res.ok) {
          showToast(`Transmitting — position ${data.position + 1} in queue`, 'success');
          $('#prompt-input').value = '';
        } else if (res.status === 402) {
          showToast(`Payment required: ${data.price} USDC`, 'error');
        } else {
          showToast(data.error || 'Transmission failed', 'error');
        }
      } catch {
        showToast('Connection lost', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Transmit Prompt';
      }
    });

    // --- Render ---
    function render() {
      $('#viewer-count').textContent = state.viewerCount;

      const np = state.nowPlaying;
      const player = $('#player');
      if (np?.videoUrl && np.status === 'ready') {
        if (!$('#player video')) {
          player.innerHTML = `<video src="${np.videoUrl}" autoplay loop muted playsinline></video>`;
        }
        $('#now-playing-prompt').textContent = np.prompt;
      } else if (!np) {
        if (!$('#placeholder')) {
          player.innerHTML = `
            <div class="player-placeholder" id="placeholder">
              <div class="moon-large"></div>
              <div class="placeholder-text" id="placeholder-text">Awaiting transmission</div>
            </div>`;
        }
        $('#now-playing-prompt').textContent = '—';
      }

      // Queue
      $('#queue-count').textContent = state.upNext.length;
      const queueList = $('#queue-list');
      if (state.upNext.length === 0) {
        queueList.innerHTML = '<div class="empty-state">Queue is empty</div>';
      } else {
        queueList.innerHTML = state.upNext.map(c => `
          <div class="queue-item">
            <div class="prompt">${escapeHtml(c.prompt)}</div>
            <div class="meta">
              <span class="status-badge status-${c.status}">
                ${c.status === 'generating'
                  ? `Generating<span class="generating-dots"><span>.</span><span>.</span><span>.</span></span>`
                  : c.status}
              </span>
              <span>${c.submittedBy?.slice(0, 8) ?? 'anon'}</span>
            </div>
          </div>
        `).join('');
      }

      // History
      const historyList = $('#history-list');
      if (state.recentlyPlayed.length === 0) {
        historyList.innerHTML = '<div class="empty-state">No transmissions yet</div>';
      } else {
        historyList.innerHTML = state.recentlyPlayed.map(c => `
          <div class="history-item">
            <div class="prompt">${escapeHtml(c.prompt)}</div>
            <div class="meta">
              <span class="status-badge status-aired">Aired</span>
              ${c.costUsd ? `<span>$${c.costUsd.toFixed(2)}</span>` : ''}
            </div>
          </div>
        `).join('');
      }
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function showToast(msg, type) {
      const t = $('#toast');
      t.textContent = msg;
      t.className = `toast show ${type || ''}`;
      setTimeout(() => { t.className = 'toast'; }, 3000);
    }

    render();
  </script>
</body>
</html>
