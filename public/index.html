<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Moon TV 🌕</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #0a0a0f;
      --bg-card: #131322;
      --border: #2a2a40;
      --text: #e0e0f0;
      --text-dim: #6a6a8a;
      --accent: #7c5cff;
      --accent-glow: rgba(124, 92, 255, 0.4);
      --moon: #f0e6d0;
      --danger: #ff4444;
      --success: #44ff88;
    }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* --- Top bar --- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
    }
    .logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .logo .moon { font-size: 24px; }
    .viewers {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-dim);
    }
    .live-dot {
      width: 8px;
      height: 8px;
      background: var(--danger);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    
    /* --- Main layout --- */
    .main {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 0;
      flex: 1;
      min-height: 0;
    }
    
    /* --- Player --- */
    .player-area {
      display: flex;
      flex-direction: column;
      padding: 24px;
      gap: 16px;
    }
    .player-wrapper {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16/9;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .player-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .player-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      gap: 12px;
      width: 100%;
      height: 100%;
    }
    .moon-anim {
      font-size: 64px;
      animation: moonFloat 4s ease-in-out infinite;
    }
    @keyframes moonFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .now-playing {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .now-playing .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
    }
    .now-playing .prompt {
      font-size: 15px;
      color: var(--text);
    }
    
    /* --- Queue / sidebar --- */
    .sidebar {
      border-left: 1px solid var(--border);
      background: var(--bg-card);
      display: flex;
      flex-direction: column;
      padding: 24px;
      gap: 20px;
      overflow-y: auto;
    }
    .sidebar h2 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    
    /* --- Prompt form --- */
    .prompt-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .prompt-input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      resize: none;
      min-height: 80px;
      transition: border-color 0.2s;
    }
    .prompt-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }
    .prompt-input::placeholder {
      color: var(--text-dim);
    }
    .submit-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .submit-btn:hover { opacity: 0.9; }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .price-tag {
      font-size: 12px;
      color: var(--text-dim);
      text-align: center;
    }
    .price-tag .price {
      color: var(--accent);
      font-weight: 600;
    }
    
    /* --- Queue items --- */
    .queue-item, .history-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .queue-item .prompt, .history-item .prompt {
      color: var(--text);
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .queue-item .meta, .history-item .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
      color: var(--text-dim);
    }
    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-generating {
      background: rgba(124, 92, 255, 0.15);
      color: var(--accent);
    }
    .status-ready {
      background: rgba(68, 255, 136, 0.15);
      color: var(--success);
    }
    .status-failed {
      background: rgba(255, 68, 68, 0.15);
      color: var(--danger);
    }
    .status-playing {
      background: rgba(255, 68, 68, 0.15);
      color: var(--danger);
    }
    
    /* --- Toast --- */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 14px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-8px);
    }
    .toast.error { border-color: var(--danger); }
    .toast.success { border-color: var(--success); }
    
    /* --- Responsive --- */
    @media (max-width: 768px) {
      .main { grid-template-columns: 1fr; }
      .sidebar { border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo">
      <span class="moon">🌕</span> Full Moon TV
    </div>
    <div class="viewers">
      <span class="live-dot"></span>
      <span id="viewer-count">0</span> watching
    </div>
  </div>
  
  <div class="main">
    <!-- Player -->
    <div class="player-area">
      <div class="player-wrapper" id="player">
        <div class="player-placeholder" id="placeholder">
          <div class="moon-anim">🌑</div>
          <div>Loading the stream...</div>
        </div>
      </div>
      <div class="now-playing" id="now-playing">
        <span class="label">Now playing:</span>
        <span class="prompt" id="now-playing-prompt">—</span>
      </div>
    </div>
    
    <!-- Sidebar: prompt form + queue -->
    <div class="sidebar">
      <div>
        <h2>Submit a Prompt</h2>
        <form class="prompt-form" id="prompt-form">
          <textarea
            class="prompt-input"
            id="prompt-input"
            placeholder="Describe a scene for the next 5-second clip..."
            maxlength="500"
            rows="3"
          ></textarea>
          <button type="submit" class="submit-btn" id="submit-btn">
            🌕 Submit Prompt
          </button>
          <div class="price-tag">
            <span class="price">$1.00</span> per prompt via x402 (USDC)
          </div>
        </form>
      </div>
      
      <div>
        <h2>Up Next (<span id="queue-count">0</span>)</h2>
        <div id="queue-list"></div>
      </div>
      
      <div>
        <h2>Recently Aired</h2>
        <div id="history-list"></div>
      </div>
    </div>
  </div>
  
  <div class="toast" id="toast"></div>
  
  <script>
    // --- Full Moon TV frontend ---
    const $ = (sel) => document.querySelector(sel);
    const state = { nowPlaying: null, upNext: [], recentlyPlayed: [], viewerCount: 0 };
    
    // --- SSE: live state ---
    const sse = new EventSource('/api/live');
    sse.addEventListener('message', (e) => {
      try {
        const data = JSON.parse(e.data);
        Object.assign(state, data);
        render();
      } catch {}
    });
    
    // --- Initial state ---
    fetch('/api/state').then(r => r.json()).then(data => {
      Object.assign(state, data);
      render();
    }).catch(() => {});
    
    // --- Submit prompt ---
    $('#prompt-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = $('#prompt-input').value.trim();
      if (!prompt) return;
      
      const btn = $('#submit-btn');
      btn.disabled = true;
      btn.textContent = 'Submitting...';
      
      try {
        const res = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt }),
        });
        const data = await res.json();
        
        if (res.ok) {
          showToast(`Prompt submitted! Position #${data.position + 1} in queue`, 'success');
          $('#prompt-input').value = '';
        } else {
          if (res.status === 402) {
            showToast(`Payment required: ${data.price} USDC`, 'error');
          } else {
            showToast(data.error || 'Submission failed', 'error');
          }
        }
      } catch (err) {
        showToast('Network error', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '🌕 Submit Prompt';
      }
    });
    
    // --- Render ---
    function render() {
      // Viewer count
      $('#viewer-count').textContent = state.viewerCount;
      
      // Now playing
      const np = state.nowPlaying;
      const player = $('#player');
      if (np?.videoUrl && np.status === 'ready') {
        if (!$('#player video')) {
          player.innerHTML = `<video src="${np.videoUrl}" autoplay loop muted playsinline></video>`;
        }
        $('#now-playing-prompt').textContent = np.prompt;
      } else if (!np) {
        const placeholder = $('#placeholder');
        if (placeholder) {
          placeholder.innerHTML = `
            <div class="moon-anim">🌑</div>
            <div>Waiting for the moon to rise...</div>
          `;
        }
        $('#now-playing-prompt').textContent = '—';
      }
      
      // Queue
      $('#queue-count').textContent = state.upNext.length;
      const queueList = $('#queue-list');
      queueList.innerHTML = state.upNext.map(clip => `
        <div class="queue-item">
          <div class="prompt">${escapeHtml(clip.prompt)}</div>
          <div class="meta">
            <span class="status-badge status-${clip.status}">${clip.status}</span>
            <span>${clip.submittedBy}</span>
          </div>
        </div>
      `).join('');
      
      // History
      const historyList = $('#history-list');
      if (state.recentlyPlayed.length === 0) {
        historyList.innerHTML = '<div style="color: var(--text-dim); font-size: 12px; padding: 8px 0;">No clips aired yet.</div>';
      } else {
        historyList.innerHTML = state.recentlyPlayed.map(clip => `
          <div class="history-item">
            <div class="prompt">${escapeHtml(clip.prompt)}</div>
            <div class="meta">
              <span class="status-badge status-played">aired</span>
              ${clip.costUsd ? `<span>$${clip.costUsd.toFixed(2)}</span>` : ''}
            </div>
          </div>
        `).join('');
      }
    }
    
    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }
    
    function showToast(msg, type) {
      const t = $('#toast');
      t.textContent = msg;
      t.className = `toast show ${type || ''}`;
      setTimeout(() => { t.className = 'toast'; }, 3000);
    }
    
    // Initial render
    render();
  </script>
</body>
</html>
